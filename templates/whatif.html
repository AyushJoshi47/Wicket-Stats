<!DOCTYPE html>
<html>
<head>
  <title>Input Submit Response</title>
</head>
<body>

  <h2>Enter Something</h2>
  <input type="text" id="query" placeholder="Type here..." />
  <!-- Fixed the extra quote and class selector -->
  <button class="generate">Submit</button> 
  <p id="response"></p>

  <script>
    document.querySelector(".generate").addEventListener("click", async () => {
      const query = document.getElementById("query").value;
      const btn = document.querySelector(".generate");
      const responseText = document.getElementById("response");

      btn.classList.add("loading");
      btn.disabled = true;

      try {
        const response = await fetch("/query", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query })
        });

        const matchData = await response.json();
        responseText.innerText = matchData.answer;

      } catch (err) { // Removed the extra "}" that was above this line
        alert("Failed to fetch prediction. Is the Flask server running?");
        console.error(err);
      } finally {
        btn.classList.remove("loading");
        btn.disabled = false;
      }
    });
  </script>

</body>
</html>
